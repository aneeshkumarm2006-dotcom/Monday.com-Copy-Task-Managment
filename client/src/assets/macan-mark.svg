<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Macan">
  <!-- Four weeks of a month. Three reported, the fourth still open — the same
       thing the Delivery grid says, at 20px. Stroke is inset so the outlined
       square's OUTER edge lands on 35..56, flush with the filled ones. -->
  <rect x="8" y="8" width="21" height="21" rx="5" fill="#2563EB"/>
  <rect x="35" y="8" width="21" height="21" rx="5" fill="#2563EB"/>
  <rect x="8" y="35" width="21" height="21" rx="5" fill="#2563EB"/>
  <rect x="37.5" y="37.5" width="16" height="16" rx="2.5" stroke="#2563EB" stroke-width="5"/>
</svg>
