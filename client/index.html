<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark, as SVG: 642 bytes, sharp at every size, one file for the
         tab, the navbar and the splash below. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` lets the installed app paint under the iPhone
         notch and home bar; anything that must clear them uses the
         env(safe-area-inset-*) values this unlocks. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- iOS ignores manifest icons; this is what Add to Home Screen uses. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Macan" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MACAN</title>

    <!--
      THE BOOT SPLASH.

      Inline in the document head and body rather than in a React component, on
      purpose: the app bundle is ~2.7MB, and everything React can render only
      begins after that has downloaded and parsed. A loader that lives inside the
      bundle therefore cannot paint during the one gap it exists to cover — the
      user sat looking at an empty `#root`, which is a white screen.

      This paints on the FIRST frame, with no JavaScript and no network request
      of its own, and `main.jsx` removes it once React has mounted.

      The animation is the mark's own meaning in motion: four weeks of a month
      lighting in reading order, the fourth still an outline. It is not a
      borrowed spinner — it is the thing the logo says.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FFFFFF;
        /* Faded out by main.jsx, then removed. `visibility` rides along so the
           splash cannot swallow a click during the transition. */
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }

      #boot .wordmark {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94A3B8;
      }

      /* Each square is one week. Reading order is week order: the delays below
         run top-left, top-right, bottom-left, bottom-right. */
      #boot rect { animation: macan-week 1.8s ease-in-out infinite; }
      #boot rect:nth-of-type(1) { animation-delay: 0ms; }
      #boot rect:nth-of-type(2) { animation-delay: 170ms; }
      #boot rect:nth-of-type(3) { animation-delay: 340ms; }
      #boot rect:nth-of-type(4) { animation-delay: 510ms; }

      @keyframes macan-week {
        0%, 72%, 100% { opacity: 0.16; }
        20%, 50%      { opacity: 1; }
      }

      /* A loading indicator that cannot animate must still READ as loading, so
         the squares settle at full strength rather than at the dim keyframe. */
      @media (prefers-reduced-motion: reduce) {
        #boot rect { animation: none; opacity: 1; }
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Macan">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="8" y="8" width="21" height="21" rx="5" fill="#2563EB"/>
        <rect x="35" y="8" width="21" height="21" rx="5" fill="#2563EB"/>
        <rect x="8" y="35" width="21" height="21" rx="5" fill="#2563EB"/>
        <rect x="37.5" y="37.5" width="16" height="16" rx="2.5" stroke="#2563EB" stroke-width="5"/>
      </svg>
      <span class="wordmark">Macan</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
